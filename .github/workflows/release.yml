name: Release

on:
  push:
    tags: ['v*']
  # Manual: el tag es obligatorio. Sin el, la accion publicaba la release
  # colgando de main (tag equivocado) en vez de abortar.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ej. v3.0.0). Debe existir y coincidir con la version de package.json.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  # Nunca cancel-in-progress: cortar a mitad de subida dejaba la release con
  # los assets a medias.
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Gate del tag contra package.json
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # En push de tag manda GITHUB_REF_NAME; en workflow_dispatch, el input.
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} version=${VERSION}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::El tag '${TAG}' no coincide con la version de package.json ('v${VERSION}'). No se publica nada: crea el tag v${VERSION} o sube la version en package.json antes de reetiquetar."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Binario de Electron (con reintentos)
        # El paquete de Electron ya no trae el binario: lo descarga aparte y, en
        # esta versión, lo hacía el primer `electron ...`. El CDN de GitHub
        # devuelve 504 de vez en cuando, y sin binario el smoke test no arranca
        # (pasó dos veces seguidas al publicar la 3.0.0). Se baja aquí, con
        # reintentos, antes de que nadie lo necesite.
        shell: bash
        run: |
          for intento in 1 2 3 4; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "intento ${intento} fallido; reintento en 15 s"
            sleep 15
          done
          echo "::error::No se pudo descargar el binario de Electron (4 intentos)."
          exit 1

      - name: Lint (ESLint 9)
        # Las notas de la release dicen que el lint pasa antes de publicar: este paso es
        # el que lo hace verdad (y es inocuo: en este repo da 0 problemas).
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Unit tests (renderer, jsdom)
        # Las notas que se publican afirman que las DOS suites están verdes: la de la
        # interfaz tiene que correr aquí o la release promete algo que nadie comprobó.
        # Si falla, cada línea del final va como anotación: desde fuera, el log del
        # runner no se puede leer y el fallo solo diría «la suite falló».
        run: |
          npm run test:renderer 2>&1 | Tee-Object -FilePath renderer-output.log
          if ($LASTEXITCODE -ne 0) {
            # una anotacion por prueba fallida, con su motivo (la linea siguiente)
            foreach ($f in (Select-String -Path renderer-output.log -Pattern '  FAIL' -Context 0,1)) {
              $texto = ($f.Line + ' ' + ($f.Context.PostContext -join ' '))
              $t = $texto -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Output "::error::$t"
            }
            exit $LASTEXITCODE
          }

      - name: Smoke test (la app arranca de verdad)
        run: npm run smoke

      - name: UI check (la interfaz responde de verdad)
        # Si falla, que lo CUENTE: cada comprobación fallida va como anotación (desde
        # fuera, el log del runner no se puede leer y el fallo solo dice «la interfaz
        # falló»).
        run: |
          npm run uicheck 2>&1 | Tee-Object -FilePath uicheck-output.log
          if ($LASTEXITCODE -ne 0) {
            foreach ($f in (Select-String -Path uicheck-output.log -Pattern 'FALLO|UI-CHECK' -Context 0,1)) {
              $texto = ($f.Line + ' ' + ($f.Context.PostContext -join ' '))
              Write-Output ('::error::' + ($texto -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'))
            }
            exit $LASTEXITCODE
          }

      - name: Build installer + portable
        # --publish never: electron-builder NO publica. Si ve GH_TOKEN crea la
        # release por su cuenta (sin descripción) y luego la acción solo le sube
        # los assets, así que la página quedaba sin notas. Publica la acción.
        run: npm run dist -- --publish never

      - name: Completar latest.yml con todos los binarios
        # electron-builder solo firma el Setup en latest.yml. El portable se quedaba
        # SIN firma publicada, así que la app descartaba su descarga («no se pudo
        # verificar la descarga») y la edición portable no podía actualizarse: pasó
        # en la 3.2.1. El script firma todos los .exe del dist usando el MISMO lector
        # que la app (main/updater.js).
        run: node scripts/latest-yml.js dist

      - name: Verificar artefactos antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in dist/SAGITARI-Setup-*.exe dist/SAGITARI-Portable-*.exe dist/latest.yml; do
            if [ ! -s "$f" ]; then
              echo "::error::Falta '${f}' o esta vacio: la release no se publica."
              missing=1
            else
              echo "OK $(wc -c < "$f") bytes  ${f}"
            fi
          done
          # El gate que impide repetir el fallo de la 3.2.1: sin firma publicada de
          # CADA binario, la app descarta la descarga y el usuario no puede
          # actualizarse. Si aquí se corta, la release no sale.
          node scripts/latest-yml.js dist --check
          exit ${missing}

      - name: Instalación real del paquete (instala el .exe y lo abre)
        # El smoke del CI arranca desde el ÁRBOL DE FUENTES: nunca abre el binario que
        # se publica. Por eso el fallo de `copyFileSync` contra app.asar (una
        # instalación nueva se quedaba sin NINGUNA skill de serie) llegó hasta la
        # release con las dos suites y el arnés de interfaz en verde. Esto instala en
        # silencio y comprueba, en un perfil recién creado, que siembra las skills
        # incluidas. Si falta una, la release no sale.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist\SAGITARI-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { Write-Output '::error::No hay instalador en dist\'; exit 1 }
          Write-Output ('Instalando ' + $setup.Name + ' (' + [math]::Round($setup.Length / 1MB, 1) + ' MB)')

          $inst = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($inst.ExitCode -ne 0) { Write-Output ('::error::El instalador salió con ' + $inst.ExitCode); exit 1 }

          # El instalador puede devolver el control antes de soltar el fichero: se
          # espera al binario en vez de darlo por hecho al primer intento.
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'SAGITARI.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 1 }
          }
          if (-not $exe) { Write-Output '::error::El instalador no dejó SAGITARI.exe en %LOCALAPPDATA%\Programs'; exit 1 }
          Write-Output ('Instalado en ' + $exe.DirectoryName)

          # Perfil NUEVO: el arranque de prueba escribe ahí, no en el %APPDATA% del runner.
          $perfil = Join-Path $env:RUNNER_TEMP ('perfil-instalado-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $perfil | Out-Null
          $salida = Join-Path $env:RUNNER_TEMP 'instalado.out.txt'
          $errores = Join-Path $env:RUNNER_TEMP 'instalado.err.txt'

          $env:SAGITARI_TEST_PROFILE = $perfil
          $app = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke', '--no-sandbox', '--disable-gpu' -Wait -PassThru `
            -RedirectStandardOutput $salida -RedirectStandardError $errores
          Remove-Item Env:\SAGITARI_TEST_PROFILE

          $texto = @()
          foreach ($f in @($salida, $errores)) { if (Test-Path $f) { $texto += Get-Content $f -Raw } }
          $texto = $texto -join "`n"
          Write-Output $texto

          # El veredicto es el MISMO que el del smoke —ventana abierta y código 0— y
          # además lo que el smoke no puede ver por arrancar desde el código: que el
          # paquete empaquetado siembra las skills de serie.
          $fallo = $null
          if ($app.ExitCode -ne 0) {
            $fallo = 'el binario instalado salió con ' + $app.ExitCode
          } elseif ($texto -notmatch 'SMOKE::\{"window":true') {
            $fallo = 'el binario instalado no abrió ventana (no apareció SMOKE::{"window":true})'
          } else {
            $sembradas = @()
            $dirSkills = Join-Path $perfil 'skills'
            if (Test-Path $dirSkills) { $sembradas = @(Get-ChildItem $dirSkills -Directory) }
            $esperadas = @(Get-ChildItem skills-starter -Directory)
            if ($sembradas.Count -ne $esperadas.Count) {
              $fallo = 'sembró ' + $sembradas.Count + ' skills de ' + $esperadas.Count + ' (una instalación nueva tiene que traerlas todas)'
            } else {
              Write-Output ('Skills sembradas: ' + (($sembradas | ForEach-Object Name) -join ', '))
            }
          }

          if ($fallo) {
            Write-Output ('::error::Paquete instalado: ' + $fallo)
            Get-Content (Join-Path $perfil 'logs\sagitari.log') -Tail 40 -ErrorAction SilentlyContinue | Write-Output
            exit 1
          }
          Write-Output 'OK: el instalador deja un binario que arranca y siembra las skills.'

      - name: Build release body (notes + SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/SAGITARI-*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No hay ningun .exe en dist/: imposible calcular el SHA-256."
            exit 1
          fi
          # Solo la seccion de ESTA version: el fichero acumula el historico y
          # publicarlo entero colgaba la tabla de descargas de la version
          # anterior en la pagina de cada release nueva (paso en la 3.0.1).
          VERSION=$(node -p "require('./package.json').version")
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            /^# SAGITARI / {
              if (capturar) exit
              if (index($0, "# SAGITARI " ver " ") == 1 || $0 == "# SAGITARI " ver) capturar = 1
            }
            capturar { print }
          ' RELEASE_NOTES.md > release-section.md
          if [ ! -s release-section.md ]; then
            echo "::error::RELEASE_NOTES.md no tiene seccion '# SAGITARI ${VERSION}': la release saldria con notas de otra version."
            exit 1
          fi
          {
            cat release-section.md
            echo
            echo '## SHA-256'
            echo '```'
            for f in "${files[@]}"; do
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            done
            echo '```'
          } > release-body.md
          echo "--- cuerpo de la release ---"
          cat release-body.md

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # En workflow_dispatch el tag viene del input, no de github.ref (main).
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-body.md
          # Si un patron no casa con nada, la release no se publica a medias.
          fail_on_unmatched_files: true
          files: |
            dist/SAGITARI-Setup-*.exe
            dist/SAGITARI-Portable-*.exe
            dist/latest.yml
            dist/SAGITARI-Setup-*.exe.blockmap
