name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release body (notes + SHA-256)
        shell: bash
        run: |
          {
            cat RELEASE_NOTES.md
            echo
            echo '## SHA-256'
            echo '```'
            for f in dist/SAGITARI-*.exe; do
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            done
            echo '```'
          } > release-body.md
          echo "--- cuerpo de la release ---"
          cat release-body.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            dist/SAGITARI-Setup-*.exe
            dist/SAGITARI-Portable-*.exe
