name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El job no necesita escribir nada en el repo: sin esto hereda el default del
# repo, que puede ser read-write.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Binario de Electron (con reintentos)
        # El paquete de Electron ya no trae el binario: lo descarga aparte y, en
        # esta versión, lo hacía el primer `electron ...`. El CDN de GitHub
        # devuelve 504 de vez en cuando, y sin binario el smoke test no arranca
        # (pasó dos veces seguidas al publicar la 3.0.0). Se baja aquí, con
        # reintentos, antes de que nadie lo necesite.
        shell: bash
        run: |
          for intento in 1 2 3 4; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "intento ${intento} fallido; reintento en 15 s"
            sleep 15
          done
          echo "::error::No se pudo descargar el binario de Electron (4 intentos)."
          exit 1

      - name: Syntax check all modules
        shell: bash
        run: |
          status=0
          for f in main/*.js agent/*.js renderer/*.js test/*.js scripts/*.js; do
            node --check "$f" || status=1
          done
          exit $status

      - name: Unit tests
        shell: bash
        # tee guarda la salida completa para el artefacto de fallo; pipefail
        # evita que el exito de tee tape el fallo de los tests.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: npm audit (alta y crítica, sin fix automático)
        # Solo informa: un fallo aquí no bloquea la release, pero queda el rastro
        # en el log para decidir si actualizar dependencias.
        shell: bash
        run: npm audit --audit-level=high || true

      - name: Unit tests (shell por defecto, como el release)
        # El release ejecuta los tests sin `shell:` —en Windows, pwsh— y aquí con
        # bash, así que el entorno del proceso no es el mismo. Esa diferencia
        # ocultó que signatureOf no encontraba Get-AuthenticodeSignature cuando
        # heredaba el PSModulePath de PowerShell 7: pasaba en el release y no en
        # la CI. Correrlos también con el shell por defecto cubre el entorno del
        # release antes de etiquetar.
        # Se guarda su salida en su PROPIO fichero: si falla este paso, el
        # artefacto de fallo ya no puede ser el log verde del paso anterior.
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath test-output-pwsh.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test (la app arranca de verdad)
        run: npm run smoke

      - name: UI check (la interfaz responde de verdad)
        # smoke sólo prueba que la ventana se abre; esto se conecta a la ventana
        # real y comprueba que el renderer está vivo (iconos, cableado, vistas).
        run: npm run uicheck

      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-context
          path: |
            test-output.log
            test-output-pwsh.log
          if-no-files-found: ignore
