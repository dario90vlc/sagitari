name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El job no necesita escribir nada en el repo: sin esto hereda el default del
# repo, que puede ser read-write.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Binario de Electron (con reintentos)
        # El paquete de Electron ya no trae el binario: lo descarga aparte y, en
        # esta versión, lo hacía el primer `electron ...`. El CDN de GitHub
        # devuelve 504 de vez en cuando, y sin binario el smoke test no arranca
        # (pasó dos veces seguidas al publicar la 3.0.0). Se baja aquí, con
        # reintentos, antes de que nadie lo necesite.
        shell: bash
        run: |
          for intento in 1 2 3 4; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "intento ${intento} fallido; reintento en 15 s"
            sleep 15
          done
          echo "::error::No se pudo descargar el binario de Electron (4 intentos)."
          exit 1

      - name: Syntax check all modules
        shell: bash
        run: |
          status=0
          for f in main/*.js agent/*.js renderer/*.js test/*.js scripts/*.js; do
            node --check "$f" || status=1
          done
          exit $status

      - name: Lint (ESLint 9)
        # `node --check` sólo mira la sintaxis: un cambio que incumple las reglas del
        # proyecto (eslint.config.js) llegaba hasta la release sin que nada lo notara.
        run: npm run lint

      - name: Unit tests
        shell: bash
        # tee guarda la salida completa para el artefacto de fallo; pipefail
        # evita que el exito de tee tape el fallo de los tests.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: npm audit (crítica bloquea, alta informa)
        # Una vulnerabilidad CRÍTICA en el árbol de dependencias no puede viajar en
        # una release: esto ya no se lo salta un `|| true`. Hoy son 0.
        #
        # El umbral ALTO se queda en aviso a propósito: las 3 altas que hay vienen de
        # electron-builder y de su árbol de desarrollo, no del paquete que se instala
        # (`build.files` solo mete main/, agent/, renderer/, skills-starter/ y
        # package.json). Poner el listón donde el proyecto no puede llegar hace que en
        # dos semanas alguien añada `|| true` otra vez y nadie lo note.
        shell: bash
        run: |
          npm audit --audit-level=critical
          npm audit --audit-level=high || true

      - name: Unit tests (shell por defecto, como el release)
        # El release ejecuta los tests sin `shell:` —en Windows, pwsh— y aquí con
        # bash, así que el entorno del proceso no es el mismo. Esa diferencia
        # ocultó que signatureOf no encontraba Get-AuthenticodeSignature cuando
        # heredaba el PSModulePath de PowerShell 7: pasaba en el release y no en
        # la CI. Correrlos también con el shell por defecto cubre el entorno del
        # release antes de etiquetar.
        # Se guarda su salida en su PROPIO fichero: si falla este paso, el
        # artefacto de fallo ya no puede ser el log verde del paso anterior.
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath test-output-pwsh.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests (renderer, jsdom)
        # `npm test` no carga test/renderer/*: sin este paso, la suite de la interfaz
        # (840 pruebas) no la corría ningún automatismo, aunque las notas de la release
        # y el README publican que las dos suites están verdes.
        # Y si falla, que lo CUENTE: sin esto el log del runner no se puede leer desde
        # fuera y el fallo solo dice «la suite falló». Cada línea del final va como
        # anotación (la primera decena se ve en la pestaña Actions).
        run: |
          npm run test:renderer 2>&1 | Tee-Object -FilePath renderer-output.log
          if ($LASTEXITCODE -ne 0) {
            # una anotacion por prueba fallida, con su motivo (la linea siguiente)
            foreach ($f in (Select-String -Path renderer-output.log -Pattern '  FAIL' -Context 0,1)) {
              $texto = ($f.Line + ' ' + ($f.Context.PostContext -join ' '))
              $t = $texto -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Output "::error::$t"
            }
            exit $LASTEXITCODE
          }

      - name: Cobertura (línea base, no bloquea)
        # Todavía sin umbral: primero hay que saber dónde está el suelo. Se publica el
        # resumen como artefacto para poder comparar versiones.
        # Medido el 21/10/2026: 81,6 % de líneas, 80,0 % de funciones, 69,4 % de ramas.
        # Los huecos que señaló: scripts/png-ops.js (23 %), agent/git.js (38 %),
        # main/ipc-mcp.js (45 %), agent/browser.js (50 %) y main/config.js (56 %).
        # Cuando haya dos o tres versiones de histórico se pone el umbral justo por
        # debajo del suelo y se vuelve bloqueante: un umbral inventado hoy solo enseña a
        # ignorar el paso.
        shell: pwsh
        run: |
          npm run cobertura 2>&1 | Tee-Object -FilePath cobertura-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir la cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura
          path: |
            coverage/coverage-summary.json
            cobertura-output.log
          if-no-files-found: ignore

      - name: Smoke test (la app arranca de verdad)
        run: npm run smoke

      - name: UI check (la interfaz responde de verdad)
        # smoke sólo prueba que la ventana se abre; esto se conecta a la ventana
        # real y comprueba que el renderer está vivo (iconos, cableado, vistas).
        run: |
          npm run uicheck 2>&1 | Tee-Object -FilePath uicheck-output.log
          if ($LASTEXITCODE -ne 0) {
            foreach ($f in (Select-String -Path uicheck-output.log -Pattern 'FALLO|UI-CHECK' -Context 0,1)) {
              $texto = ($f.Line + ' ' + ($f.Context.PostContext -join ' '))
              Write-Output ('::error::' + ($texto -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'))
            }
            exit $LASTEXITCODE
          }

      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-context
          path: |
            test-output.log
            test-output-pwsh.log
          if-no-files-found: ignore
