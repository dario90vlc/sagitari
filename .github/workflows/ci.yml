name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all modules
        shell: bash
        run: |
          status=0
          for f in main/*.js agent/*.js renderer/app.js test/*.js scripts/*.js; do
            node --check "$f" || status=1
          done
          exit $status

      - name: Unit tests
        run: npm test

      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-context
          path: |
            npm-debug.log*
          if-no-files-found: ignore
